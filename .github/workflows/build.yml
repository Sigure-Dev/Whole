name: Build IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build IPA (signed if secrets present)
    runs-on: macos-15
    env:
      HAS_P12: ${{ secrets.P12_BASE64 != '' }}
      HAS_PROF: ${{ secrets.MOBILEPROVISION_BASE64 != '' }}
      HAS_PASS: ${{ secrets.P12_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Whole.xcodeproj \
            -scheme Whole \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Decode signing assets
        id: sig
        if: env.HAS_P12 == 'true' && env.HAS_PROF == 'true' && env.HAS_PASS == 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          PROF_B64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          printf '%s' "$P12_B64" | base64 --decode > signing.p12
          printf '%s' "$PROF_B64" | base64 --decode > signing.mobileprovision
          wc -c signing.p12 signing.mobileprovision
          shasum -a 256 signing.p12 signing.mobileprovision
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sign app (ad-hoc)
        if: steps.sig.outputs.available == 'true'
        env:
          P12_PASS: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN=ci.keychain
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"

          # PKCS12 パーサーを security から openssl に切り替え(形式問題の回避)
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nokeys -clcerts -out cert.pem
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nocerts -nodes -out key.pem
          security import cert.pem -k "$KEYCHAIN" -T /usr/bin/codesign
          security import key.pem -k "$KEYCHAIN" -T /usr/bin/codesign
          # WWDR中間証明書を鍵束に入れて署名に埋め込む(OTA整合性検証に必須)
          security import "$GITHUB_WORKSPACE/.github/certs/AppleWWDRCAG3.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" || true

          APP="build/Build/Products/Release-iphoneos/Whole.app"
          cp signing.mobileprovision "$APP/embedded.mobileprovision"
          security cms -D -i signing.mobileprovision > profile-full.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile-full.plist > entitlements.plist
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/iPhone Distribution|Apple Distribution|Apple Development/{print $2; exit}')
          echo "Signing identity: $IDENTITY"
          codesign -f -s "$IDENTITY" --entitlements entitlements.plist "$APP"
          codesign --verify --verbose=1 "$APP"
          echo "--- signature chain ---"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          security delete-keychain "$KEYCHAIN"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Whole.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          if [ -f Payload/Whole.app/embedded.mobileprovision ]; then
            NAME="Whole-signed.ipa"
          else
            NAME="Whole-unsigned.ipa"
          fi
          zip -qry "$NAME" Payload
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: Upload IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Whole-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Attach to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}

      - name: Deploy OTA to GitHub Pages
        if: env.IPA_NAME == 'Whole-signed.ipa' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUNDLE_ID: app.date8631.cassiopeia7025
          BASE_URL: https://sigure-dev.github.io/Whole
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/echo
          PAGES_DIR="$GITHUB_WORKSPACE/../pages-deploy"
          rm -rf "$PAGES_DIR"
          if ! git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/Sigure-Dev/Whole.git" "$PAGES_DIR" 2>/dev/null; then
            echo "checkpoint: gh-pages not found, creating"
            mkdir -p "$PAGES_DIR"
            cd "$PAGES_DIR"
            git init -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/Sigure-Dev/Whole.git"
          else
            echo "checkpoint: gh-pages cloned"
            cd "$PAGES_DIR"
          fi
          git config user.name "whole-ci"
          git config user.email "actions@users.noreply.github.com"

          cp "$GITHUB_WORKSPACE/$IPA_NAME" Whole-signed.ipa
          cp "$GITHUB_WORKSPACE/Resources/icon.png" icon-src.png
          sips -z 512 512 icon-src.png --out icon-512.png >/dev/null
          sips -z 57 57 icon-src.png --out icon-57.png >/dev/null
          rm icon-src.png
          echo "checkpoint: files staged"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$GITHUB_WORKSPACE/Payload/Whole.app/Info.plist")
          BUILDNUM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$GITHUB_WORKSPACE/Payload/Whole.app/Info.plist")
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${BASE_URL}/Whole-signed.ipa</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>display-image</string>
                    <key>needs-shine</key><false/>
                    <key>url</key><string>${BASE_URL}/icon-57.png</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>full-size-image</string>
                    <key>needs-shine</key><false/>
                    <key>url</key><string>${BASE_URL}/icon-512.png</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Whole</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Whole - インストール</title>
          <style>
            body { background:#0d0d12; color:#f2f2f7; font-family:-apple-system,sans-serif;
                   display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
            .card { text-align:center; padding:32px 24px; max-width:360px; }
            .icon { width:110px; height:110px; border-radius:24px; }
            h1 { font-size:24px; margin:16px 0 4px; }
            .ver { color:#8e8e93; font-size:13px; margin-bottom:28px; }
            a.btn { display:block; background:#30d158; color:#fff; text-decoration:none;
                    font-weight:600; font-size:17px; padding:14px; border-radius:14px; }
            .note { color:#8e8e93; font-size:12px; line-height:1.7; margin-top:26px; text-align:left; }
          </style>
          </head>
          <body>
          <div class="card">
            <img class="icon" src="icon-512.png" alt="Whole">
            <h1>Whole</h1>
            <div class="ver">v${VERSION} (${BUILDNUM}) - ${DATE}</div>
            <a class="btn" href="itms-services://?action=download-manifest&amp;url=${BASE_URL}/manifest.plist">インストール</a>
            <div class="note">
              初回のみ: インストール後、「設定 &gt; 一般 &gt; VPNとデバイス管理」で
              「chu yuanxin」を信頼してください。<br><br>
              更新時も同じボタンから上書きインストールできます。<br>
              このアプリは登録済み端末でのみ動作します。
            </div>
          </div>
          </body>
          </html>
          EOF
          echo "checkpoint: manifest + html written"

          git add -A
          git commit -m "Deploy v${VERSION} (${BUILDNUM}) ${DATE}" || echo "no changes"
          echo "checkpoint: committed, pushing..."
          git push origin gh-pages 2>&1
          echo "OTA deployed to gh-pages"

