name: Build IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build IPA (signed if secrets present)
    runs-on: macos-15
    env:
      HAS_P12: ${{ secrets.P12_BASE64 != '' }}
      HAS_PROF: ${{ secrets.MOBILEPROVISION_BASE64 != '' }}
      HAS_PASS: ${{ secrets.P12_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Whole.xcodeproj \
            -scheme Whole \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Decode signing assets
        id: sig
        if: env.HAS_P12 == 'true' && env.HAS_PROF == 'true' && env.HAS_PASS == 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          PROF_B64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          printf '%s' "$P12_B64" | base64 --decode > signing.p12
          printf '%s' "$PROF_B64" | base64 --decode > signing.mobileprovision
          wc -c signing.p12 signing.mobileprovision
          shasum -a 256 signing.p12 signing.mobileprovision
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sign app (ad-hoc)
        if: steps.sig.outputs.available == 'true'
        env:
          P12_PASS: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN=ci.keychain
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"

          # PKCS12 パーサーを security から openssl に切り替え(形式問題の回避)
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nokeys -clcerts -out cert.pem
          openssl pkcs12 -in signing.p12 -passin "pass:$P12_PASS" -nocerts -nodes -out key.pem
          security import cert.pem -k "$KEYCHAIN" -T /usr/bin/codesign
          security import key.pem -k "$KEYCHAIN" -T /usr/bin/codesign
          # WWDR中間証明書を鍵束に入れて署名に埋め込む(OTA整合性検証に必須)
          security import "$GITHUB_WORKSPACE/.github/certs/AppleWWDRCAG3.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" || true

          APP="build/Build/Products/Release-iphoneos/Whole.app"
          cp signing.mobileprovision "$APP/embedded.mobileprovision"
          security cms -D -i signing.mobileprovision > profile-full.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile-full.plist > entitlements.plist

          # 空配列・空文字の権限を除去( OTA整合性検証の失敗原因候補)
          python3 - <<'PY'
          import plistlib
          with open('entitlements.plist', 'rb') as f:
              ent = plistlib.load(f)
          clean = {}
          for k, v in ent.items():
              if isinstance(v, (list, dict)) and len(v) == 0:
                  print('dropping empty:', k)
                  continue
              if isinstance(v, str) and not v.strip():
                  print('dropping empty:', k)
                  continue
              clean[k] = v
          with open('entitlements.plist', 'wb') as f:
              plistlib.dump(clean, f)
          print('kept %d entitlements' % len(clean))
          PY
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/iPhone Distribution|Apple Distribution|Apple Development/{print $2; exit}')
          echo "Signing identity: $IDENTITY"
          codesign -f -s "$IDENTITY" --entitlements entitlements.plist "$APP"
          codesign --verify --verbose=1 "$APP"
          echo "--- signature chain ---"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          security delete-keychain "$KEYCHAIN"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Whole.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          if [ -f Payload/Whole.app/embedded.mobileprovision ]; then
            NAME="Whole-signed.ipa"
          else
            NAME="Whole-unsigned.ipa"
          fi
          zip -qry "$NAME" Payload
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - name: Upload IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Whole-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Attach to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}

