name: Whole
options:
  bundleIdPrefix: jp.whole
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"

packages:
  Zsign:
    url: https://github.com/claration/zsign
    branch: package
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    minVersion: 0.9.20

targets:
  Whole:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/Info.plist
    dependencies:
      - package: Zsign
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.date8631.cassiopeia7025
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Yoko AppIcon-YokoYoko"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Whole:
    build:
      targets:
        Whole: all
    run:
      config: Debug
    archive:
      config: Release
